<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#6366f1"/>
  
  <!-- Thread/Angle design -->
  <g transform="translate(512, 512)">
    <!-- Left thread -->
    <path d="M -200 -150 Q -100 0 -150 150" stroke="#ffffff" stroke-width="40" fill="none" stroke-linecap="round"/>
    
    <!-- Right thread -->
    <path d="M 200 -150 Q 100 0 150 150" stroke="#fbbf24" stroke-width="40" fill="none" stroke-linecap="round"/>
    
    <!-- Center connector -->
    <path d="M -50 -200 L 0 0 L 50 200" stroke="#60a5fa" stroke-width="40" fill="none" stroke-linecap="round"/>
    
    <!-- Circles at intersections -->
    <circle cx="0" cy="0" r="35" fill="#ffffff"/>
    <circle cx="-150" cy="150" r="30" fill="#fbbf24"/>
    <circle cx="150" cy="150" r="30" fill="#60a5fa"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="15" fill="#6366f1"/>
  </g>
</svg>